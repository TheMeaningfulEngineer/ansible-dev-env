- name: Dev environment setup
  hosts: localhost
  vars:
    INSTALL_ROOT: "{{ ansible_env.HOME }}"
    HOME_USER_DIR: "{{ INSTALL_ROOT }}"
    INCLUDE_DESKTOP: false
    INCLUDE_PERSONAL: false
    LOCAL_APPIMAGE_PATH: "{{ HOME_USER_DIR }}/.local/appimages"
    LOCAL_BIN_PATH: "{{ HOME_USER_DIR }}/.local/bin"
    LOCAL_DOT_CONFIG_PATH: "{{ HOME_USER_DIR }}/.config"
    NVIM_VERSION: "v0.12.6"
    OBSIDIAN_VERSION: "1.8.9"
    FZF_VERSION: "v0.74.5"
    NODE_VERSION: "v26.12.0"
    RIPGREP_VERSION: "15.2.0"
    LS_LUA_VERSION: "3.19.2"
    SHELLCHECK_VERSION: "0.11.0"
    SHFMT_VERSION: "3.14.1"
    BASEDPYRIGHT_VERSION: "1.40.2"
    BASH_LANGUAGE_SERVER_VERSION: "5.8.1"

  roles:
    - tooling
    - role: desktop
      when: INCLUDE_DESKTOP | bool
    - role: personal
      when: INCLUDE_PERSONAL | bool

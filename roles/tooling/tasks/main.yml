---

# --- Local directories ---

- name: Create the home dir for app images if not there
  file:
    path: "{{ LOCAL_APPIMAGE_PATH }}"
    state: directory
    mode: '0755'
  tags: [dirs]

- name: Create "{{ LOCAL_BIN_PATH }}" if not there
  file:
    path: "{{ LOCAL_BIN_PATH }}"
    state: directory
    mode: '0755'
  tags: [dirs]

- name: Create "{{ LOCAL_DOT_CONFIG_PATH }}" if not there
  file:
    path: "{{ LOCAL_DOT_CONFIG_PATH }}"
    state: directory
    mode: '0755'
  tags: [dirs]

- name: Export local bin to path
  blockinfile:
    path: "{{ HOME_USER_DIR }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK [local_dirs path]"
    create: true
    block: |
      export PATH=$PATH:{{ LOCAL_BIN_PATH }}
  tags: [dirs]

- name: Set var to trim prompt size
  blockinfile:
    path: "{{ HOME_USER_DIR }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK [local_dirs trim prompt]"
    create: true
    block: |
      PROMPT_DIRTRIM=2
  tags: [dirs]

# --- Neovim ---

- name: Create appimage directory
  file:
    path: "{{ LOCAL_APPIMAGE_PATH }}"
    state: directory
    mode: '0755'
  tags: [nvim]

- name: Create local bin directory
  file:
    path: "{{ LOCAL_BIN_PATH }}"
    state: directory
    mode: '0755'
  tags: [nvim]

- name: Install make and build tools for compiling telescope fzf
  become: true
  apt:
    name:
      - make
      - build-essential
    state: present
    update_cache: true
  tags: [nvim]

- name: Download Neovim
  get_url:
    url: "https://github.com/neovim/neovim/releases/download/{{ NVIM_VERSION }}/nvim-linux-x86_64.appimage"
    dest: "{{ LOCAL_APPIMAGE_PATH }}/nvim.{{ NVIM_VERSION }}.appimage"
    mode: '0755'
  tags: [nvim]

- name: Create a symbolic link for neovim
  file:
    src: "{{ LOCAL_APPIMAGE_PATH }}/nvim.{{ NVIM_VERSION }}.appimage"
    dest: "{{ LOCAL_BIN_PATH }}/nvim"
    state: link
  tags: [nvim]

- name: Symlink nvim config to "{{ LOCAL_DOT_CONFIG_PATH }}"
  file:
    src: "{{ playbook_dir }}/nvim"
    dest: "{{ LOCAL_DOT_CONFIG_PATH }}/nvim"
    state: link
  tags: [nvim]

- name: Modify bashrc to add aliases for vim and vi
  blockinfile:
    path: "{{ HOME_USER_DIR }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK [nvim]"
    create: true
    block: |
        vim() {
            if [ -n "$NVIM" ]; then
                command nvim --server "$NVIM" --remote "$(realpath $@)"
            else
                command nvim "$@"
            fi
        }

        vi() {
            if [ -n "$NVIM" ]; then
                command nvim --server "$NVIM" --remote "$(realpath $@)"
            else
                command nvim "$@"
            fi
        }
  tags: [nvim]

# --- Language Server: Bash ---

- name: Install Node.js
  apt:
    name: nodejs
    state: present
  become: true
  tags: [lsp, lsp-bash, lsp-python]

- name: Install npm
  apt:
    name: npm
    state: present
  become: true
  tags: [lsp, lsp-bash, lsp-python]

- name: Download ShellCheck version {{ SHELLCHECK_VERSION }}
  get_url:
    url: "https://github.com/koalaman/shellcheck/releases/download/v{{ SHELLCHECK_VERSION }}/shellcheck-v{{ SHELLCHECK_VERSION }}.linux.x86_64.tar.xz"
    dest: "/tmp/shellcheck.tar.xz"
  tags: [lsp, lsp-bash]

- name: Extract ShellCheck
  unarchive:
    src: "/tmp/shellcheck.tar.xz"
    dest: "/tmp"
    remote_src: yes
  tags: [lsp, lsp-bash]

- name: Move ShellCheck to ~/.local/bin
  command: mv /tmp/shellcheck-v{{ SHELLCHECK_VERSION }}/shellcheck "{{ ansible_env.HOME }}/.local/bin/shellcheck"
  args:
    creates: "{{ ansible_env.HOME }}/.local/bin/shellcheck"
  tags: [lsp, lsp-bash]

- name: Download shfmt version {{ SHFMT_VERSION }}
  get_url:
    url: "https://github.com/mvdan/sh/releases/download/v{{ SHFMT_VERSION }}/shfmt_v{{ SHFMT_VERSION }}_linux_amd64"
    dest: "/tmp/shfmt"
  tags: [lsp, lsp-bash]

- name: Move shfmt to ~/.local/bin and make executable
  command: mv /tmp/shfmt "{{ ansible_env.HOME }}/.local/bin/shfmt"
  args:
    creates: "{{ ansible_env.HOME }}/.local/bin/shfmt"
  tags: [lsp, lsp-bash]

- name: Set executable permissions for shfmt
  file:
    path: "{{ ansible_env.HOME }}/.local/bin/shfmt"
    mode: "0755"
  tags: [lsp, lsp-bash]

- name: Install bash-language-server in ~/.local
  npm:
    name: bash-language-server
    path: "{{ ansible_env.HOME }}/.local"
  tags: [lsp, lsp-bash]

- name: Symlink bash-language-server
  file:
    src: "{{ ansible_env.HOME }}/.local/node_modules/.bin/bash-language-server"
    dest: "{{ ansible_env.HOME }}/.local/bin/bash-language-server"
    state: link
  tags: [lsp, lsp-bash]

# --- Language Server: Lua ---

- name: Download Lua Language Server
  get_url:
    url: "https://github.com/LuaLS/lua-language-server/releases/download/{{ LS_LUA_VERSION }}/lua-language-server-{{ LS_LUA_VERSION }}-linux-x64.tar.gz"
    dest: "/tmp/lua-language-server-{{ LS_LUA_VERSION }}-linux-x64.tar.gz"
  tags: [lsp, lsp-lua]

- name: Ensure ~/.local/share/lua-language-server directory exists
  file:
    path: "{{ ansible_env.HOME }}/.local/share/lua-language-server"
    state: directory
  tags: [lsp, lsp-lua]

- name: Extract Lua Language Server
  unarchive:
    src: "/tmp/lua-language-server-{{ LS_LUA_VERSION }}-linux-x64.tar.gz"
    dest: "{{ ansible_env.HOME }}/.local/share/lua-language-server"
    remote_src: yes
    extra_opts:
      - "--one-top-level"
    creates: "{{ ansible_env.HOME }}/.local/share/lua-language-server/lua-language-server-{{ LS_LUA_VERSION }}-linux-x64"
  tags: [lsp, lsp-lua]

- name: Ensure ~/.local/bin exists
  file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
  tags: [lsp, lsp-lua]

- name: Symlink lua-language-server into ~/.local/bin
  file:
    src: "{{ ansible_env.HOME }}/.local/share/lua-language-server/lua-language-server-{{ LS_LUA_VERSION }}-linux-x64/bin/lua-language-server"
    dest: "{{ ansible_env.HOME }}/.local/bin/lua-language-server"
    state: link
    force: yes
    follow: false
  tags: [lsp, lsp-lua]

# --- Language Server: Python ---

- name: Install basedpyright globally
  npm:
    name: basedpyright
    path: "{{ ansible_env.HOME }}/.local"
  tags: [lsp, lsp-python]

- name: Symlink basedpyright
  file:
    src: "{{ ansible_env.HOME }}/.local/node_modules/.bin/basedpyright"
    dest: "{{ ansible_env.HOME }}/.local/bin/basedpyright"
    state: link
  tags: [lsp, lsp-python]

# --- FZF ---

- name: Git checkout fzf
  git:
    repo: https://github.com/junegunn/fzf.git
    dest: "{{ HOME_USER_DIR }}/.fzf"
    version: "{{ FZF_VERSION }}"
  tags: [fzf]

- name: Install fzf
  shell: "yes | {{ HOME_USER_DIR }}/.fzf/install"
  tags: [fzf]

- name: Install ripgrep
  become: yes
  apt:
    update_cache: yes
    cache_valid_time: 3600
    name:
      - ripgrep
    state: present
  tags: [fzf]

- name: Modify bashrc to use fzf rg
  blockinfile:
    path: "{{ HOME_USER_DIR }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK [fzf]"
    create: true
    block: |
      export FZF_DEFAULT_COMMAND='rg --files'
      [ -f ~/.fzf.bash ] && source ~/.fzf.bash
  tags: [fzf]

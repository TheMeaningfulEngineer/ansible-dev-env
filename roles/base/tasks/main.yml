---

# --- Local directories ---

- name: Create the home dir for app images if not there
  file:
    path: "{{ LOCAL_APPIMAGE_PATH }}"
    state: directory
    mode: '0755'
  tags: [dirs]

- name: Create "{{ LOCAL_BIN_PATH }}" if not there
  file:
    path: "{{ LOCAL_BIN_PATH }}"
    state: directory
    mode: '0755'
  tags: [dirs]

- name: Create "{{ LOCAL_DOT_CONFIG_PATH }}" if not there
  file:
    path: "{{ LOCAL_DOT_CONFIG_PATH }}"
    state: directory
    mode: '0755'
  tags: [dirs]

- name: Export local bin to path
  blockinfile:
    path: "{{ HOME_USER_DIR }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK [local_dirs path]"
    create: true
    block: |
      export PATH=$PATH:{{ LOCAL_BIN_PATH }}
  tags: [dirs]

- name: Set var to trim prompt size
  blockinfile:
    path: "{{ HOME_USER_DIR }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK [local_dirs trim prompt]"
    create: true
    block: |
      PROMPT_DIRTRIM=2
  tags: [dirs]

# --- Keyboard remapping ---

- name: Ensure dconf is installed
  become: true
  apt:
    name: dconf-cli
    state: present
  tags: [keymaps]

- name: Set Caps Lock to Control (GNOME Wayland)
  become: false
  command: >
    gsettings set org.gnome.desktop.input-sources xkb-options "['ctrl:nocaps']"
  changed_when: true
  tags: [keymaps]

- name: Verify the keymap setting
  become: false
  command: >
    gsettings get org.gnome.desktop.input-sources xkb-options
  register: gsettings_output
  changed_when: false
  tags: [keymaps]

- name: Debug keymap output
  debug:
    msg: "{{ gsettings_output.stdout }}"
  tags: [keymaps]

# --- Nerd fonts ---

- name: Clone or update nerd-fonts repo (shallow)
  git:
    repo: https://github.com/ryanoasis/nerd-fonts.git
    dest: "{{ ansible_env.HOME }}/.local/src/nerd-fonts"
    depth: 1
    update: yes
  become: false
  tags: [fonts]

- name: Ensure install.sh is executable
  file:
    path: "{{ ansible_env.HOME }}/.local/src/nerd-fonts/install.sh"
    mode: '0755'
  become: false
  tags: [fonts]

- name: Install JetBrainsMono Nerd Font
  command: ./install.sh -s JetBrainsMono
  args:
    chdir: "{{ ansible_env.HOME }}/.local/src/nerd-fonts"
    creates: "{{ ansible_env.HOME }}/.local/share/fonts/JetBrainsMono\ Nerd\ Font\ Complete.ttf"
  become: false
  tags: [fonts]

- name: Refresh font cache
  command: fc-cache -f -v
  environment:
    HOME: "{{ ansible_env.HOME }}"
  become: false
  tags: [fonts]

- name: Get GNOME Terminal default profile ID
  command: gsettings get org.gnome.Terminal.ProfilesList default
  register: default_profile
  changed_when: false
  tags: [fonts]

- name: Disable "use system font" in that profile
  command: >
    gsettings set
    org.gnome.Terminal.Legacy.Profile:/org/gnome/terminal/legacy/profiles:/:{{ default_profile.stdout | trim("'") }}/
    use-system-font false
  tags: [fonts]

- name: Set JetBrains Mono Nerd Font size 15 in that profile
  command: >
    gsettings set
    org.gnome.Terminal.Legacy.Profile:/org/gnome/terminal/legacy/profiles:/:{{ default_profile.stdout | trim("'") }}/
    font 'JetBrainsMono NF 15'
  tags: [fonts]
